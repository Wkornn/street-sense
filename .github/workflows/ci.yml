name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install uv
      - uses: astral-sh/setup-uv@v6

      # Install the exact versions from uv.lock.
      - name: Install dependencies
        run: uv sync --frozen

      # Code checks 
      - name: Ruff
        run: uv run ruff check .

      # Tests. The data checks are skipped
      - name: Tests
        run: uv run pytest -m "not data"

      # requirements.txt match uv.lock
      - name: requirements.txt is up to date
        run: |
          uv export --frozen --format requirements-txt --no-hashes -o requirements.txt
          git diff --exit-code requirements.txt